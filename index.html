<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INDIESHOT 메뉴</title>
<meta name="description" content="인디샷 카페 메뉴판">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --ink:#141414; --sub:#6b6b6b; --line:#e6e3de; --bg:#fbfaf8; --new:#c2410c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
         -webkit-font-smoothing:antialiased; }
  header { text-align:center; padding:36px 20px 14px; }
  header img { width:min(260px,70%); height:auto; }
  header p { margin:10px 0 0; font-size:13px; color:var(--sub); }
  nav { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line);
        display:flex; gap:6px; overflow-x:auto; padding:10px 14px; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav a { flex:none; text-decoration:none; color:var(--ink); font-size:13px; font-weight:700;
          letter-spacing:.04em; padding:7px 13px; border:1px solid var(--ink); border-radius:999px; }
  nav a.on { background:var(--ink); color:#fff; }
  main { max-width:760px; margin:0 auto; padding:0 18px 40px; }
  section { padding-top:30px; scroll-margin-top:56px; }
  h2 { font-size:22px; font-weight:800; letter-spacing:.06em; margin:0 0 6px; }
  .item { padding:15px 0; border-bottom:1px solid var(--line); }
  .row { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  .name { font-size:16px; font-weight:700; }
  .opt { font-size:12px; font-weight:500; color:var(--sub); margin-left:4px; }
  .price { font-size:15px; font-weight:700; white-space:nowrap; text-align:right; line-height:1.5; }
  .price small { font-size:11px; color:var(--sub); font-weight:600; margin-right:3px; }
  .en { font-size:13px; color:var(--sub); margin-top:2px; }
  .desc { font-size:13px; color:#444; margin-top:5px; line-height:1.5; }
  .add { font-size:12px; color:var(--sub); margin-top:4px; }
  .badge { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.08em; color:#fff;
           background:var(--new); border-radius:4px; padding:2px 6px; margin-left:6px; vertical-align:2px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px 14px; margin-top:14px; }
  .card img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px; background:#fff; display:block; }
  .card .row { margin-top:9px; flex-direction:column; gap:2px; }
  .card .price { text-align:left; }
  .item.thumb { display:flex; gap:14px; align-items:flex-start; }
  .item.thumb img { width:96px; height:96px; object-fit:cover; border-radius:10px; flex:none; }
  .item.thumb .body { flex:1; min-width:0; }
  .card .name { font-size:15px; }
  .card .price { font-size:14px; }
  .card.isnew img { outline:2px solid var(--new); outline-offset:2px; }
  .alc .item { padding:10px 0; }
  footer { text-align:center; font-size:12px; color:var(--sub); padding:26px 18px 40px; line-height:1.8;
           border-top:1px solid var(--line); }
  @media (min-width:640px) { .grid { grid-template-columns:1fr 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <img src="images/logo.png" alt="INDIESHOT">
  <p>월·화·수·금·토·일 11:00–22:00 · 목요일 휴무</p>
</header>
<nav id="nav"></nav>
<main id="menu"></main>
<footer>
  영업 시간: 월, 화, 수, 금, 토, 일 11:00–22:00 / 목요일 휴무<br>
  마지막 주문: 마감 1시간 전
</footer>

<script src="menu.js"></script>
<script>
/* ===== 화면 그리기 (고칠 필요 없음) ===== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const priceHTML = p => typeof p === "string" ? `${p}원`
  : Object.entries(p).map(([k,v]) => `<div><small>${k}</small>${v}원</div>`).join("");
const nameHTML = it => `<span class="name">${esc(it.name)}${it.opt?`<span class="opt">(${esc(it.opt)})</span>`:""}${it.isNew?'<span class="badge">NEW</span>':""}</span>`;
const extra = it => `${it.en?`<div class="en">${esc(it.en)}</div>`:""}${it.desc?`<div class="desc">${esc(it.desc)}</div>`:""}${it.add?`<div class="add">${esc(it.add)}</div>`:""}`;

document.getElementById("nav").innerHTML = MENU.map(s => `<a href="#${s.id}">${s.title}</a>`).join("");
document.getElementById("menu").innerHTML = MENU.map(s => {
  const body = s.photo
    ? `<div class="grid">${s.items.map(it => `<div class="card${it.isNew?" isnew":""}">
         <img src="images/${it.img}" alt="${esc(it.name)}" loading="lazy">
         <div class="row">${nameHTML(it)}<span class="price">${priceHTML(it.price)}</span></div>${extra(it)}</div>`).join("")}</div>`
    : s.items.map(it => {
        const inner = `<div class="row">${nameHTML(it)}<span class="price">${priceHTML(it.price)}</span></div>${extra(it)}`;
        return it.img
          ? `<div class="item thumb"><img src="images/${it.img}" alt="${esc(it.name)}" loading="lazy"><div class="body">${inner}</div></div>`
          : `<div class="item">${inner}</div>`;
      }).join("");
  return `<section id="${s.id}" class="${s.id==="alcohol"?"alc":""}"><h2>${s.title}</h2>${body}</section>`;
}).join("");

/* 스크롤 위치에 따라 위쪽 메뉴 버튼 강조 */
const links = [...document.querySelectorAll("nav a")];
const obs = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => {
    const on = a.getAttribute("href") === "#" + e.target.id;
    a.classList.toggle("on", on);
    if (on) a.scrollIntoView({inline:"center", block:"nearest"});
  });
}), { rootMargin:"-45% 0px -50% 0px" });
document.querySelectorAll("section").forEach(s => obs.observe(s));
</script>
</body>
</html>
